<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlockX - Panel de Análisis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --surface: #050505;
            --surface2: #111111;
            --surface3: #161616;
            --border: #262626;
            --accent: #f59e0b;
            --accent-soft: rgba(245,158,11,0.18);
            --text: #ffffff;
            --text-dim: #cbd5e1;
            --text-muted: #94a3b8;
            --alert-green: #22c55e;
            --alert-yellow: #f59e0b;
            --alert-red: #ef4444;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .navbar, .card, .table, .btn, .form-control, .file-label, .alert, .badge {
            color: var(--text) !important;
        }
        .navbar {
            background-color: var(--surface2) !important;
            border-bottom: 1px solid var(--border);
        }
        .container {
            color: var(--text);
        }
        .card {
            background-color: var(--surface) !important;
            border: 1px solid var(--border) !important;
            border-radius: 18px;
        }
        .card-header {
            background-color: transparent !important;
            border-bottom: 1px solid var(--border);
        }
        .btn-primary {
            background-color: var(--accent) !important;
            border-color: transparent !important;
            color: #0f172a !important;
        }
        .btn-secondary {
            background-color: var(--surface2) !important;
            border-color: var(--border) !important;
            color: var(--text) !important;
        }
        .btn-outline-primary {
            color: var(--accent) !important;
            border-color: var(--accent) !important;
        }
        .btn-outline-primary:hover {
            background-color: var(--accent-soft);
            color: var(--text) !important;
        }
        .btn-outline-secondary {
            color: var(--text) !important;
            border-color: var(--border) !important;
        }
        .bg-primary {
            background-color: var(--accent) !important;
            color: #0f172a !important;
        }
        .bg-secondary {
            background-color: var(--surface2) !important;
            color: var(--text) !important;
        }
        .bg-success {
            background-color: var(--alert-green) !important;
            color: #0f172a !important;
        }
        .bg-warning {
            background-color: var(--accent) !important;
            color: #0f172a !important;
        }
        .bg-info {
            background-color: var(--accent) !important;
            color: #0f172a !important;
        }
        .bg-dark {
            background-color: var(--surface2) !important;
        }
        .text-muted {
            color: var(--text-muted) !important;
        }
        .form-control, .file-label {
            background-color: var(--surface3);
            border-color: var(--border);
            color: var(--text);
        }
        .form-control::placeholder {
            color: var(--text-muted);
            opacity: 1;
        }
        .form-control:focus {
            background-color: var(--surface3);
            color: var(--text);
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 0.2rem rgba(245,158,11,.18);
        }
        .table {
            color: var(--text);
            border-color: var(--border);
        }
        .table th, .table td {
            border-color: var(--border);
            vertical-align: middle;
        }
        .table thead th {
            border-bottom: 1px solid var(--border);
            color: var(--text-dim);
        }
        .table-hover tbody tr:hover {
            background-color: rgba(255,255,255,.06);
        }
        .table-striped>tbody>tr:nth-of-type(odd) {
            background-color: rgba(255,255,255,.03);
        }
        .alert {
            background-color: var(--surface2);
            border-color: var(--border);
            color: var(--text);
        }
        .badge {
            background-color: rgba(255,255,255,.05);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .badge.alerta-1 {
            background-color: rgba(34,197,94,.16);
            color: var(--alert-green);
        }
        .badge.alerta-2 {
            background-color: rgba(245,158,11,.16);
            color: var(--accent);
        }
        .badge.alerta-3 {
            background-color: rgba(239,68,68,.18);
            color: var(--alert-red);
        }
        .tr-alerta-1 {
            background-color: rgba(34,197,94,.08);
        }
        .tr-alerta-2 {
            background-color: rgba(245,158,11,.08);
        }
        .tr-alerta-3 {
            background-color: rgba(239,68,68,.08);
        }
        .file-label {
            border-color: var(--border);
            border-radius: 14px;
        }
        .btn-group .btn {
            border-radius: 999px;
        }
        .btn-group .btn.active,
        .btn-group .btn:focus {
            background-color: var(--accent-soft);
            color: var(--text) !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">FlockX Analytics - Ingeniería Industrial</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
