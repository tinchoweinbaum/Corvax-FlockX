<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlockX - Panel de Análisis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #040505;
            --surface: rgba(15, 23, 42, 0.98);
            --surface2: rgba(12, 17, 32, 0.95);
            --surface3: rgba(18, 25, 44, 0.95);
            --border: rgba(148, 163, 184, 0.15);
            --accent: #f59e0b;
            --accent-soft: rgba(245, 158, 11, 0.18);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --text-muted: #cbd5e1;
            --alert-green: #22c55e;
            --alert-yellow: #fbbf24;
            --alert-red: #ef4444;
            --shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
        }
        html, body {
            min-height: 100%;
        }
        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, rgba(245, 158, 11, 0.08), transparent 28%),
                        radial-gradient(circle at 20% 10%, rgba(59, 130, 246, 0.09), transparent 20%),
                        linear-gradient(180deg, #05070d 0%, #030406 48%, #040506 100%);
            color: var(--text);
        }
        .navbar, .card, .table, .btn, .form-control, .file-label, .alert, .badge {
            color: var(--text) !important;
        }
        .navbar {
            background-color: rgba(11, 19, 35, 0.95) !important;
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
            backdrop-filter: blur(16px);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .container {
            max-width: 1180px;
            padding: 0 1.5rem 3rem;
        }
        .card {
            background: var(--surface) !important;
            color: var(--text) !important;
            border: 1px solid var(--border) !important;
            border-radius: 24px;
            box-shadow: var(--shadow);
        }
        .card, .card * {
            color: inherit !important;
        }
        .card.shadow-sm {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
        }
        .card-header {
            background-color: transparent !important;
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
            border-radius: 24px 24px 0 0;
            color: var(--text) !important;
        }
        .card-body {
            background: rgba(15, 23, 42, 0.95) !important;
            color: var(--text) !important;
        }
        .btn {
            border-radius: 999px;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }
        .btn:hover {
            transform: translateY(-1px);
        }
        .btn-primary {
            background: linear-gradient(135deg, #f59e0b, #eab308) !important;
            border-color: transparent !important;
            color: #0f172a !important;
            box-shadow: 0 12px 30px rgba(245, 158, 11, 0.18);
        }
        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.05) !important;
            border-color: rgba(148, 163, 184, 0.16) !important;
            color: var(--text) !important;
        }
        .btn-outline-primary {
            color: var(--accent) !important;
            border-color: rgba(245, 158, 11, 0.4) !important;
        }
        .btn-outline-primary:hover {
            background-color: rgba(245, 158, 11, 0.12);
            color: var(--text) !important;
        }
        .btn-outline-secondary {
            color: var(--text) !important;
            border-color: rgba(148, 163, 184, 0.24) !important;
        }
        .bg-primary {
            background-color: #f59e0b !important;
            color: #0f172a !important;
        }
        .bg-secondary {
            background-color: rgba(255, 255, 255, 0.04) !important;
            color: var(--text) !important;
        }
        .bg-success {
            background-color: #22c55e !important;
            color: #0f172a !important;
        }
        .bg-warning {
            background-color: #f59e0b !important;
            color: #0f172a !important;
        }
        .bg-info {
            background-color: #2563eb !important;
            color: #f8fafc !important;
        }
        .bg-dark {
            background-color: rgba(15, 23, 42, 0.95) !important;
        }
        .text-muted {
            color: var(--text-muted) !important;
        }
        .form-control, .file-label {
            background-color: rgba(255, 255, 255, 0.04);
            border-color: rgba(148, 163, 184, 0.16);
            color: var(--text);
            border-radius: 16px;
        }
        .form-control::placeholder {
            color: rgba(203, 209, 225, 0.7);
            opacity: 1;
        }
        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.04);
            color: var(--text);
            border-color: #f59e0b !important;
            box-shadow: 0 0 0 0.2rem rgba(245, 158, 11, 0.18);
        }
        .table {
            color: var(--text) !important;
            border-color: rgba(148, 163, 184, 0.12);
            border-radius: 18px;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.95) !important;
        }
        .table th, .table td,
        .table a,
        .table small,
        .table span,
        .table .badge {
            color: var(--text) !important;
        }
        .table th, .table td {
            border-color: rgba(148, 163, 184, 0.10);
            vertical-align: middle;
            background: transparent !important;
        }
        .table thead th {
            border-bottom: 1px solid rgba(148, 163, 184, 0.16);
            color: var(--text-dim) !important;
            background: rgba(15, 23, 42, 0.98) !important;
        }
        .table-striped > tbody > tr:nth-of-type(odd) {
            background-color: rgba(255, 255, 255, 0.02) !important;
        }
        .table-striped > tbody > tr:nth-of-type(even) {
            background-color: rgba(255, 255, 255, 0.01) !important;
        }
        .table-hover tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.06) !important;
        }
        /* Incoherent rows: strong dark background + red accent */
        .table-danger,
        .table-danger th,
        .table-danger td {
            background-color: #000000 !important;
            color: #ffffff !important;
            border-color: rgba(239, 68, 68, 0.6) !important;
        }
        .table-danger th,
        .table-danger td {
            font-weight: 600;
        }
        /* make the incoherent badge very visible */
        .table-danger .badge.bg-danger {
            background-color: #ef4444 !important;
            color: #ffffff !important;
            box-shadow: 0 6px 18px rgba(239,68,68,0.18);
            border: 1px solid rgba(255,255,255,0.04);
        }
        
        .table-striped > tbody > tr:nth-of-type(odd) {
            background-color: rgba(255, 255, 255, 0.025);
        }
        .alert {
            background-color: rgba(255, 255, 255, 0.04);
            border-color: rgba(148, 163, 184, 0.1);
            color: var(--text);
        }
        .badge {
            background-color: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(148, 163, 184, 0.16);
            color: var(--text);
        }
        .badge.alerta-1 {
            background-color: #22c55e !important;
            color: #0f172a !important;
            border-color: rgba(34, 197, 94, 0.35) !important;
            box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.12);
        }
        .badge.alerta-2 {
            background-color: #facc15 !important;
            color: #0f172a !important;
            border-color: rgba(245, 158, 11, 0.35) !important;
            box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.12);
        }
        .badge.alerta-3 {
            background-color: #ef4444 !important;
            color: #ffffff !important;
            border-color: rgba(239, 68, 68, 0.35) !important;
            box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.12);
        }
        .tr-alerta-1 {
            background-color: rgba(34, 197, 94, 0.10);
        }
        .tr-alerta-2 {
            background-color: rgba(245, 158, 11, 0.10);
        }
        .tr-alerta-3 {
            background-color: rgba(239, 68, 68, 0.10);
        }

        /* Standardize incoherent rows so they remain readable and consistent */
        .table-danger,
        .table-danger th,
        .table-danger td {
            background-color: #000000 !important;
            color: #ffffff !important;
            border-color: rgba(239, 68, 68, 0.6) !important;
        }
        /* Prevent hover rules from changing the appearance of incoherent rows */
        .table-danger:hover,
        .table-danger:focus,
        .table-hover tbody tr.table-danger:hover {
            background-color: #0b0b0b !important;
            color: #ffffff !important;
        }
        /* Make the incoherent badge consistent and visible */
        .table-danger .badge,
        .table-danger .badge.bg-danger {
            background-color: #ef4444 !important;
            color: #ffffff !important;
            border: 1px solid rgba(255,255,255,0.03) !important;
            box-shadow: 0 6px 18px rgba(239,68,68,0.16) !important;
        }
        .file-label {
            border-color: rgba(148, 163, 184, 0.18);
            border-radius: 18px;
        }
        .btn-group .btn {
            border-radius: 999px;
        }
        .btn-group .btn.active,
        .btn-group .btn:focus {
            background-color: rgba(245, 158, 11, 0.12);
            color: var(--text) !important;
        }
        .page-title {
            letter-spacing: 0.01em;
            margin-bottom: 1rem;
        }
        .section-panel {
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(148, 163, 184, 0.08);
            border-radius: 24px;
        }
        .table-responsive {
            border-radius: 22px;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }
        .list-group-item {
            background: transparent;
            border: 1px solid rgba(148, 163, 184, 0.08);
            border-radius: 14px;
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">FlockX Analytics - Ingeniería Industrial</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
